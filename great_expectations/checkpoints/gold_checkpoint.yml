# Checkpoint Gold
# Relie la suite gold_suite à la table gold.disponibilite_courante dans PostgreSQL
# Déclenché par Airflow après la transformation Silver->Gold
# Si la validation échoue : alerte déclenchée mais pipeline continue
# (Gold est déjà chargé — on signale l'anomalie sans rollback)

name: gold_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint

site_names:
  - local_site

validations:
  - batch_request:
      datasource_name: postgres_silver
      data_connector_name: default_inferred_data_connector_name
      data_asset_name: gold.disponibilite_courante
    expectation_suite_name: gold_suite