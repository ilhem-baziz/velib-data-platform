# Checkpoint Silver
# Relie les suites silver_station_suite et silver_releve_suite
# aux DataFrames pandas produits par bronze_to_silver.py
# Déclenché par Airflow après la transformation Bronze->Silver
# Si la validation échoue : pipeline arrêté + résultat écrit dans monitoring

name: silver_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint

site_names:
  - local_site

validations:
  - batch_request:
      datasource_name: pandas_dataframe
      data_connector_name: default_runtime_data_connector_name
      data_asset_name: silver_station
      runtime_parameters:
        batch_data: null  # DataFrame df_station injecté dynamiquement
      batch_identifiers:
        run_id: null
    expectation_suite_name: silver_station_suite

  - batch_request:
      datasource_name: pandas_dataframe
      data_connector_name: default_runtime_data_connector_name
      data_asset_name: silver_releve
      runtime_parameters:
        batch_data: null  # DataFrame df_releve injecté dynamiquement
      batch_identifiers:
        run_id: null
    expectation_suite_name: silver_releve_suite